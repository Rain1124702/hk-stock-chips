name: Daily HK Stock Chips Update

on:
  schedule:
    # 香港時間 HKT = UTC+8；工作日每約2小時（開市後至收市）
    - cron: '0 2 * * 1-5'   # 10:00 HKT 開市後
    - cron: '0 4 * * 1-5'   # 12:00 HKT 午市前／休市
    - cron: '0 6 * * 1-5'   # 14:00 HKT 下午市
    - cron: '30 8 * * 1-5'  # 16:30 HKT 收市後（最後一次）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run update script
        run: python update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: chips update $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
